<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex,nofollow"
  >

  <title>Website Unavailable | Healthcare Pharmaceuticals</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      font-family: Arial, Helvetica, sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(23, 137, 255, 0.25),
          transparent 35%
        ),
        linear-gradient(
          145deg,
          #020711,
          #03152f,
          #020a19
        );
    }

    .maintenance-card {
      width: min(650px, 100%);

      padding: 50px 35px;

      border: 1px solid rgba(120, 190, 255, 0.25);

      border-radius: 28px;

      background:
        rgba(7, 30, 67, 0.75);

      backdrop-filter: blur(20px);

      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.45);

      text-align: center;
    }

    .logo {
      width: 75px;
      height: 75px;

      margin: 0 auto 25px;

      border-radius: 22px;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          145deg,
          #49b9ff,
          #0871e9
        );

      font-size: 3rem;
      font-weight: 800;
    }

    .eyebrow {
      color: #9edcff;

      font-size: 0.8rem;
      font-weight: 800;

      letter-spacing: 0.12em;

      text-transform: uppercase;
    }

    h1 {
      margin: 15px 0 18px;

      font-size: clamp(2rem, 7vw, 3.5rem);

      line-height: 1.05;
    }

    p {
      max-width: 500px;

      margin: 0 auto;

      color: #b7cee8;

      font-size: 1rem;

      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      margin-top: 30px;

      padding: 10px 16px;

      border: 1px solid rgba(100, 220, 190, 0.3);

      border-radius: 999px;

      color: #8ff0cf;

      background: rgba(40, 190, 145, 0.08);
    }

    .dot {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #65e4bd;

      box-shadow:
        0 0 12px #65e4bd;
    }

    .footer {
      margin-top: 35px;

      color: #6f91ba;

      font-size: 0.8rem;
    }

    @media (max-width: 500px) {
      .maintenance-card {
        padding: 40px 22px;
      }

      .logo {
        width: 65px;
        height: 65px;

        font-size: 2.5rem;
      }
    }
  </style>
</head>

<body>

  <main class="maintenance-card">

    <div class="logo">
      +
    </div>

    <span class="eyebrow">
      Healthcare Pharmaceuticals
    </span>

    <h1>
      Website temporarily unavailable
    </h1>

    <p>
      This website is unavailable as a result of unpaid hosting.
    </p>

    <div class="status">

      <span class="dot"></span>

      Website Unavailable

    </div>

    <div class="footer">
      Thank you for your patience.
    </div>

  </main>

</body>
</html>
